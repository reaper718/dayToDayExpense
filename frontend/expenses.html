<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- Main Container -->
    <div class="container py-5">
        <!-- Premium User Section -->
        <div id="premiumSection" class="alert alert-success d-none
            d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">

            <div>
                <h5 class="mb-1">👑 You are a Premium User!</h5>
                <p class="mb-0">Enjoy your premium membership benefits.</p>
            </div>

            <button
                type="button"
                class="btn btn-success"
                onclick="showLeaderboard()">
                Show Leaderboard
            </button>

        </div>

        <!-- Heading -->
        
        <!-- Heading and Premium Button -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

            <!-- Left: Heading -->
            <div>
                <h1 class="fw-bold mb-1">Expense Tracker</h1>
                <p class="text-muted mb-0">Track and manage your expenses</p>
            </div>

            <!-- Right: Premium Membership -->
            <button
                type="button"
                class="btn btn-warning fw-bold px-4 py-2"
                onclick="buyPremium()"
            >
                <span class="me-1">👑</span>
                Buy Premium Membership
            </button>

        </div>



        <!-- Expense Form Card -->
        <div class="card shadow-sm mb-4">

            <div class="card-body">

                <h4 class="card-title mb-4">Add Expense</h4>

                <form onsubmit="addExpense(event)">

                    <div class="row g-3">

                        <!-- Expense -->
                        <div class="col-md-4">

                            <label for="expense" class="form-label">
                                Expense
                            </label>

                            <div class="input-group">
                                <span class="input-group-text">₹</span>

                                <input
                                    type="number"
                                    id="expense"
                                    name="expense"
                                    class="form-control"
                                    placeholder="Enter amount"
                                    required
                                >
                            </div>

                        </div>


                        <!-- Description -->
                        <div class="col-md-4">

                            <label for="description" class="form-label">
                                Description
                            </label>

                            <input
                                type="text"
                                id="description"
                                name="description"
                                class="form-control"
                                placeholder="e.g. Movie"
                                required
                            >
                            
                            <small id="ai-response" style="display: none;"></small>
                        </div>


                        <!-- Category -->
                        <div class="col-md-4">

                            <label for="category" class="form-label">
                                Category
                            </label>

                            <select
                                id="category"
                                name="category"
                                class="form-select"
                                required
                            >

                                <option value="" selected disabled>
                                    Select category
                                </option>

                                <option value="fuel">
                                    Fuel
                                </option>

                                <option value="food">
                                    Food
                                </option>

                                <option value="electricity">
                                    Electricity
                                </option>

                                <option value="Movie">
                                    Movie
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- Submit Button -->
                    <div class="mt-4">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Add Expense
                        </button>

                    </div>

                </form>

            </div>

        </div>


        <!-- Expense List -->
        <div class="card shadow-sm">

            <div class="card-body">

                <h4 class="card-title mb-4">
                    Your Expenses
                </h4>

                <!-- Your JavaScript will add <li> elements here -->
                <ul class="list-group" id="expenseList"></ul>

            </div>

        </div>

        <!-- Leaderboard Section -->
        <div id="leaderboardSection" class="card shadow-sm mt-4 d-none">
            <div class="card-body">
                <h4 class="card-title mb-4">🏆 Leaderboard</h4>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Rank</th>
                                <th>User Name</th>
                                <th>Total Expenses (₹)</th>
                            </tr>
                        </thead>

                        <tbody id="leaderboardBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.5.1/axios.min.js"></script>
    <!-- Your JavaScript -->
    <script src="index.js"></script>

</body>

</html>
