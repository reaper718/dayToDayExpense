```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Status</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="bg-light">
  <div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-sm p-4 text-center" style="max-width: 500px; width: 100%;">
      <h3 id="statusTitle">Verifying payment...</h3>
      <p id="statusMessage" class="text-secondary">
        Please wait while we confirm your transaction.
      </p>

      <button
        id="retryButton"
        class="btn btn-outline-primary mb-2"
        onclick="verifyPayment()"
        hidden
      >
        Check payment again
      </button>

      <a href="expenses.html" class="btn btn-primary">
        Return to Expenses
      </a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.5.1/axios.min.js"></script>

  <script>
    const API_URL = "http://localhost:3000";

    async function verifyPayment() {
      const title = document.getElementById("statusTitle");
      const message = document.getElementById("statusMessage");
      const retryButton = document.getElementById("retryButton");

      const token = sessionStorage.getItem("token");
      const orderId = new URLSearchParams(window.location.search)
        .get("order_id");

      retryButton.hidden = true;

      if (!token) {
        title.textContent = "Login required";
        message.textContent =
          "Please log in again to verify your payment.";
        return;
      }

      if (!orderId) {
        title.textContent = "Unable to verify payment";
        message.textContent = "The order ID is missing.";
        return;
      }

      try {
        const response = await axios.get(
          `${API_URL}/payment/verify`,
          {
            params: { order_id: orderId },
            headers: {
              Authorization: `Bearer ${token}`
            }
          }
        );

        const result = response.data;

        if (result.status === "SUCCESSFUL") {
          title.textContent = "Transaction successful!";
          message.textContent =
            "Your premium membership is now active.";
          alert("Transaction successful!");
        } else if (result.status === "FAILED") {
          title.textContent = "TRANSACTION FAILED";
          message.textContent =
            "Your payment was not successful. Please try again.";
          alert("TRANSACTION FAILED.");
        } else {
          title.textContent = "Payment pending";
          message.textContent =
            "Your payment is still being processed. Please check again shortly.";
          retryButton.hidden = false;
        }
      } catch (error) {
        console.error(
          "Verification error:",
          error.response?.data || error.message
        );

        title.textContent = "Unable to verify payment";
        message.textContent =
          "We could not confirm the payment right now. Please try again.";
        retryButton.hidden = false;
      }
    }

    verifyPayment();
  </script>
</body>
</html>
```
